<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>ASAS — Students</title>

  <link rel="stylesheet" href="/css/theme.css"/>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    .filter-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.02); transition: background 0.25s, border-color 0.25s; }
    .filter-group { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; flex: 1; }

    .table-search { padding: 0.55rem 1rem; border-radius: 8px; border: 1px solid var(--border); width: 100%; min-width: 240px; background: var(--bg-input); color: var(--text-primary); outline: none; transition: border-color 0.2s; font-family: var(--ff-body); }
    .table-search:focus { border-color: var(--accent); }
    .filter-select { padding: 0.55rem 0.85rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-primary); font-family: var(--ff-body); outline: none; min-width: 180px; }

    .export-btns { display: flex; gap: 0.5rem; align-items: center; }
    .btn-export { display: flex; align-items: center; gap: 0.4rem; padding: 0.55rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); font-size: 0.85rem; cursor: pointer; transition: background 0.2s; font-weight: 500; height: 38px; }
    .btn-export:hover { background: var(--bg-hover); }

    .table-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: rgba(127,127,200,0.04); padding: 0.85rem 1rem; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    td { padding: 0.9rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; vertical-align: middle; color: var(--text-primary); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg-hover); }

    th.sortable { cursor: pointer; position: relative; padding-right: 1.5rem !important; user-select: none; transition: background 0.2s; }
    th.sortable:hover { background: rgba(0,0,0,0.04); }
    th.sortable::after { content: '↕'; position: absolute; right: 0.4rem; color: var(--text-muted); opacity: 0.4; font-size: 0.9rem; font-weight: normal; }

    .modal-back { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
    .modal-back.open { display: flex; }
    .modal { background: var(--bg-card); width: 100%; max-width: 460px; border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow-modal); animation: mIn 0.2s ease both; }
    @keyframes mIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .modal-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-family: var(--ff-display); font-size: 1.2rem; font-weight: 600; color: var(--text-primary); }
    .modal-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.1rem; }
    .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 0.75rem; }
    .modal-row { display: flex; gap: 0.75rem; }
    .modal-row .field { flex: 1; }

    .modal-input, .modal-select { width: 100%; padding: 0.65rem 0.85rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-primary); font-family: var(--ff-body); outline: none; transition: border-color 0.2s; }
    .modal-input:focus, .modal-select:focus { border-color: var(--accent); }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-college" id="sidebarCollege"></div>
  <nav id="sideNav"></nav>
  <div class="sidebar-footer">
    <div class="theme-row">
      <span class="theme-label"><span id="themeIcon"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span><span id="themeLabel">Light mode</span></span>
      <label class="toggle-switch"><input type="checkbox" id="themeToggle"/><span class="toggle-track"></span></label>
    </div>
    <div class="user-pill">
      <div class="user-avatar" id="userAvatar">?</div>
      <div class="user-info"><div class="user-name" id="userName">…</div><div class="user-role" id="userRole">admin</div></div>
      <button class="btn-logout" id="logoutBtn" title="Sign out"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div>
      <h1 class="page-title">Students</h1>
      <p class="page-subtitle">Manage the student roster used for attendance</p>
    </div>
  </div>

  <div class="content">
    <div class="filter-card">
      <div class="filter-group">
        <input type="text" id="searchInput" class="table-search" placeholder="🔍 Search name or student ID..." />
        <select id="courseFilter" class="filter-select"><option value="">All Courses</option></select>
      </div>
      <div class="export-btns">
        <button class="btn-export" id="exportExcelBtn">Excel</button>
        <button class="btn-export" id="exportPdfBtn">PDF</button>
        <button class="btn btn-primary" id="addBtn" style="height: 38px;">+ Add Student</button>
      </div>
    </div>

    <div class="table-wrap">
      <table id="dataTable">
        <thead>
          <tr>
            <th class="sortable" data-sort="asc">Student ID</th>
            <th class="sortable">Name</th>
            <th class="sortable">Course</th>
            <th>Status</th>
            <th style="width:100px;text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr class="empty-row"><td colspan="5" style="text-align:center; padding: 2rem;"><span class="spin"></span> Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal-back" id="studentModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Add Student</div>
      <button class="btn-icon" id="modalClose" style="background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text-muted);">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Student ID *</label>
        <input type="text" id="studentCode" class="modal-input" placeholder="e.g. 1234567" required />
      </div>
      <div class="modal-row">
        <div class="field">
          <label>First Name *</label>
          <input type="text" id="firstName" class="modal-input" placeholder="First name" required />
        </div>
        <div class="field">
          <label>Middle Name</label>
          <input type="text" id="middleName" class="modal-input" placeholder="Middle name" />
        </div>
        <div class="field">
          <label>Last Name *</label>
          <input type="text" id="lastName" class="modal-input" placeholder="Last name" required />
        </div>
      </div>
      <div class="field">
        <label>Course *</label>
        <select id="studentCourse" class="modal-select" required><option value="">Select course...</option></select>
      </div>
      <div class="field" style="flex-direction:row;align-items:center;gap:0.75rem;margin-top:0.25rem">
        <label class="toggle-switch"><input type="checkbox" id="isActive" checked/><span class="toggle-track"></span></label>
        <label style="margin:0; font-weight:600; color:var(--text-primary)">Active Student</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalSave">Save Student</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { requireRole } from '/js/auth/session.js';
  import { initSidebar } from '/js/components/sidebar.js';
  import { supabase } from '/js/config/supabase.js';
  import { exportToExcel, exportToPDF, preloadLogoForPDF } from '/js/utils/exportHelpers.js';

  const session = await requireRole('admin');
  initSidebar(session, 'students');
  preloadLogoForPDF();
  const generatedBy = session?.profile?.full_name ?? 'Admin';

  function toast(msg, type='success') {
    const c=document.getElementById('toast');
    const el=document.createElement('div');
    el.className=`toast-item ${type}`; el.textContent=msg;
    c.appendChild(el); setTimeout(()=>el.remove(),4000);
  }

  function courseLabel(c) {
    if (!c) return '—';
    return c.division ? `${c.year} ${c.program} ${c.division}` : `${c.year} ${c.program}`;
  }

  function fullName(s) {
    return [s.first_name, s.middle_name, s.last_name].filter(Boolean).join(' ');
  }

  let studentsData = [];
  let coursesData = [];
  let filteredData = [];
  let currentId = null;

  async function loadCourses() {
    const { data, error } = await supabase.from('courses')
      .select('id, year, program, division, is_active')
      .eq('is_active', true)
      .order('year');
    if (error) { toast(error.message, 'error'); return; }
    coursesData = data || [];

    const filterSel = document.getElementById('courseFilter');
    const modalSel = document.getElementById('studentCourse');
    const opts = coursesData.map(c => `<option value="${c.id}">${courseLabel(c)}</option>`).join('');
    filterSel.innerHTML = `<option value="">All Courses</option>${opts}`;
    modalSel.innerHTML = `<option value="">Select course...</option>${opts}`;
  }

  async function loadData() {
    try {
      const { data, error } = await supabase.from('students')
        .select('id, student_id, first_name, middle_name, last_name, is_active, course:courses!course_id(id, year, program, division)')
        .order('student_id');

      if (error) throw error;
      studentsData = data;
      applyFilters();
    } catch(e) {
      toast(e.message, 'error');
      document.getElementById('tableBody').innerHTML = `<tr class="empty-row"><td colspan="5" style="text-align:center; padding: 2rem; color:var(--error);">Error loading data</td></tr>`;
    }
  }

  function applyFilters() {
    const fSearch = document.getElementById('searchInput').value.toLowerCase();
    const fCourse = document.getElementById('courseFilter').value;
    filteredData = studentsData.filter(s => {
      if (fCourse && s.course?.id !== fCourse) return false;
      if (fSearch) {
        const hay = `${s.student_id} ${fullName(s)}`.toLowerCase();
        if (!hay.includes(fSearch)) return false;
      }
      return true;
    });
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    if (!filteredData.length) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="5" style="text-align:center; padding: 3rem; color:var(--text-muted);">No students match your search.</td></tr>`;
      return;
    }
    tbody.innerHTML = filteredData.map(s => `
      <tr>
        <td style="font-weight:600;">${s.student_id}</td>
        <td>${fullName(s)}</td>
        <td>${courseLabel(s.course)}</td>
        <td><span class="badge ${s.is_active ? 'badge-active' : 'badge-inactive'}">${s.is_active ? 'Active' : 'Inactive'}</span></td>
        <td style="text-align:right">
          <button class="btn btn-ghost btn-sm edit-btn" data-id="${s.id}">Edit</button>
        </td>
      </tr>
    `).join('');
    bindActions();
  }

  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('courseFilter').addEventListener('change', applyFilters);

  document.querySelectorAll('th.sortable').forEach((th, i) => {
    th.addEventListener('click', () => {
      const tbody = document.getElementById('tableBody');
      const rows = Array.from(tbody.querySelectorAll('tr:not(.empty-row)'));
      if(!rows.length) return;
      const isAsc = th.dataset.sort !== 'asc';
      th.dataset.sort = isAsc ? 'asc' : 'desc';
      rows.sort((a, b) => {
        const aTxt = a.children[i]?.textContent.trim() || '';
        const bTxt = b.children[i]?.textContent.trim() || '';
        return isAsc ? aTxt.localeCompare(bTxt, undefined, {numeric: true}) : bTxt.localeCompare(aTxt, undefined, {numeric: true});
      });
      rows.forEach(r => tbody.appendChild(r));
    });
  });

  document.getElementById('exportPdfBtn').addEventListener('click', () => {
    if (!filteredData.length) return toast('No data to export', 'warn');
    const flat = filteredData.map(s => ({ id: s.student_id, name: fullName(s), course: courseLabel(s.course), status: s.is_active ? 'Active' : 'Inactive' }));
    exportToPDF(flat, [
      { header: 'Student ID', key: 'id', width: 30 },
      { header: 'Name', key: 'name', width: 55 },
      { header: 'Course', key: 'course', width: 35 },
      { header: 'Status', key: 'status', width: 25 },
    ], 'Student List', 'Students_Report', '', generatedBy);
  });

  document.getElementById('exportExcelBtn').addEventListener('click', () => {
    if (!filteredData.length) return toast('No data to export', 'warn');
    const flat = filteredData.map(s => ({ id: s.student_id, name: fullName(s), course: courseLabel(s.course), status: s.is_active ? 'Active' : 'Inactive' }));
    exportToExcel(flat, [
      { header: 'Student ID', key: 'id', width: 15 },
      { header: 'Name', key: 'name', width: 30 },
      { header: 'Course', key: 'course', width: 20 },
      { header: 'Status', key: 'status', width: 12 },
    ], 'Students_Report');
  });

  function openModal(id = null) {
    currentId = id;
    document.getElementById('modalTitle').textContent = id ? 'Edit Student' : 'Add Student';
    if (id) {
      const row = studentsData.find(s => s.id === id);
      document.getElementById('studentCode').value = row.student_id || '';
      document.getElementById('firstName').value = row.first_name || '';
      document.getElementById('middleName').value = row.middle_name || '';
      document.getElementById('lastName').value = row.last_name || '';
      document.getElementById('studentCourse').value = row.course?.id || '';
      document.getElementById('isActive').checked = row.is_active;
    } else {
      document.getElementById('studentCode').value = '';
      document.getElementById('firstName').value = '';
      document.getElementById('middleName').value = '';
      document.getElementById('lastName').value = '';
      document.getElementById('studentCourse').value = '';
      document.getElementById('isActive').checked = true;
    }
    document.getElementById('studentModal').classList.add('open');
  }

  function closeModal() { document.getElementById('studentModal').classList.remove('open'); currentId = null; }

  document.getElementById('addBtn').addEventListener('click', () => openModal());
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);

  document.getElementById('modalSave').addEventListener('click', async () => {
    const student_id = document.getElementById('studentCode').value.trim();
    const first_name = document.getElementById('firstName').value.trim();
    const middle_name = document.getElementById('middleName').value.trim();
    const last_name = document.getElementById('lastName').value.trim();
    const course_id = document.getElementById('studentCourse').value;
    const is_active = document.getElementById('isActive').checked;

    if (!student_id) { toast('Student ID is required', 'warn'); return; }
    if (!first_name || !last_name) { toast('First and last name are required', 'warn'); return; }
    if (!course_id) { toast('Course is required', 'warn'); return; }

    const payload = { student_id, first_name, middle_name: middle_name || null, last_name, course_id, is_active };
    const btn = document.getElementById('modalSave');
    btn.disabled = true;

    try {
      if (currentId) {
        const { error } = await supabase.from('students').update(payload).eq('id', currentId);
        if (error) throw error;
        toast('Student updated successfully');
      } else {
        const { error } = await supabase.from('students').insert(payload);
        if (error) throw error;
        toast('Student added successfully');
      }
      closeModal();
      await loadData();
    } catch(e) {
      toast(e.message.includes('duplicate') ? 'That Student ID already exists' : e.message, 'error');
    } finally { btn.disabled = false; }
  });

  function bindActions() {
    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', (e) => openModal(e.currentTarget.dataset.id));
    });
  }

  await loadCourses();
  await loadData();
</script>
</body>
</html>
