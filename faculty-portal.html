<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASAS — My Portal</title>

  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <style>
    .tabs { display:flex; gap:.5rem; margin-bottom:1.5rem; background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:.35rem; max-width:420px; }
    .tab { flex:1; text-align:center; padding:.6rem 1rem; border-radius:9px; font-size:.88rem; font-weight:600; cursor:pointer; border:none; background:transparent; color:var(--text-muted); transition:background .2s, color .2s; }
    .tab.active { background:var(--accent); color:#fff; }

    .filter-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .filter-field { display: flex; flex-direction: column; gap: 0.35rem; min-width: 200px; }
    .filter-field label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); }
    .filter-input, .filter-select { padding: 0.6rem 0.85rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-primary); font-family: var(--ff-body); outline: none; }
    .filter-input:focus, .filter-select:focus { border-color: var(--accent); }

    .table-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.02); margin-bottom: 1.5rem; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: rgba(127,127,200,0.04); padding: 0.85rem 1rem; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; vertical-align: middle; color: var(--text-primary); }
    tr:last-child td { border-bottom: none; }
    th.sortable { cursor: pointer; position: relative; padding-right: 1.5rem !important; user-select: none; }
    th.sortable::after { content: '↕'; position: absolute; right: 0.4rem; color: var(--text-muted); opacity: 0.4; font-size: 0.9rem; }

    .lecture-row { cursor: pointer; transition: background 0.15s; }
    .lecture-row:hover td { filter: brightness(0.97); }
    .lr-time { font-weight: 700; color: var(--accent); font-size: 0.8rem; white-space: nowrap; }
    .lr-none  td { background: transparent; }
    .lr-red   td { background: rgba(224,92,107,.10); }
    .lr-green td { background: rgba(62,207,142,.10); }
    .lr-lock-icon { margin-left: 0.4rem; }

    .mark-badge { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.65rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .mark-full { background: rgba(62,207,142,.18); color: var(--success); }
    .mark-partial { background: rgba(245,166,35,.18); color: var(--warn); }
    .mark-none { background: rgba(127,127,127,0.1); color: var(--text-muted); }
    .img-badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.25rem 0.6rem; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
    .img-yes { background: rgba(62,207,142,.18); color: var(--success); }
    .img-no { background: rgba(224,92,107,.14); color: var(--error); }
    .pct-chip { display:inline-flex; align-items:center; padding:0.25rem 0.65rem; border-radius:20px; font-size:0.78rem; font-weight:800; }
    .pc-green { background: rgba(62,207,142,.18); color: var(--success); }
    .pc-amber { background: rgba(245,166,35,.18); color: var(--warn); }
    .pc-red   { background: rgba(224,92,107,.16); color: var(--error); }

    .empty-note { text-align:center; padding: 3rem; color: var(--text-muted); }
    .not-mentor-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 3rem 2rem; text-align: center; }
    .not-mentor-card svg { width: 44px; height: 44px; color: var(--text-muted); margin-bottom: 1rem; opacity: 0.7; }
    .not-mentor-card h2 { font-family: var(--ff-display); font-size: 1.3rem; color: var(--text-primary); margin-bottom: 0.5rem; }
    .not-mentor-card p { color: var(--text-muted); font-size: 0.9rem; max-width: 420px; margin: 0 auto; }

    /* ── Modal ─────────────────────────────────────────────── */
    .modal-back { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
    .modal-back.open { display: flex; }
    .att-modal { background: var(--bg-card); width: 100%; max-width: 720px; max-height: 88vh; border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow-modal); display: flex; flex-direction: column; overflow: hidden; }
    .att-modal-header { padding: 1.1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
    .att-modal-title { font-family: var(--ff-display); font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }
    .att-modal-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }
    .att-modal-body { padding: 1.25rem 1.5rem; overflow-y: auto; flex: 1; scrollbar-width: none; -ms-overflow-style: none; }
    .att-modal-body::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .att-modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }

    .roster-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.85rem; }
    .roster-summary { display: flex; gap: 0.6rem; flex-wrap: wrap; font-size: 0.8rem; }
    .sum-chip { display: flex; align-items: center; gap: 0.35rem; padding: 0.3rem 0.7rem; border-radius: 20px; background: var(--bg-body); border: 1px solid var(--border); }
    .sum-dot { width: 8px; height: 8px; border-radius: 50%; }

    .roster-search-row { display: flex; gap: 0.6rem; margin-bottom: 0.85rem; flex-wrap: wrap; }
    .roster-search { flex: 1; min-width: 180px; padding: 0.55rem 0.85rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-primary); font-family: var(--ff-body); outline: none; }
    .roster-search:focus { border-color: var(--accent); }

    .roster-table th.sortable { cursor: pointer; user-select: none; position: relative; padding-right: 1.4rem; }
    .roster-table th.sortable::after { content: '↕'; position: absolute; right: 0.4rem; opacity: 0.4; }

    .status-btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.9rem; border-radius: 20px; font-size: 0.78rem; font-weight: 700; cursor: pointer; user-select: none; border: 1px solid transparent; transition: all 0.15s; }
    .status-btn:hover { filter: brightness(0.97); }
    .status-btn[disabled] { cursor: not-allowed; opacity: 0.75; }
    .sb-not_marked { background: rgba(127,127,127,0.08); color: var(--text-muted); border-color: var(--border); }
    .sb-present    { background: rgba(62,207,142,.16); color: var(--success); }
    .sb-absent     { background: rgba(224,92,107,.18); color: var(--error); }
    .sb-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    .proof-section { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px dashed var(--border); }
    .proof-title { font-size: 0.85rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.75rem; }
    .proof-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .proof-preview { width: 90px; height: 90px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); background: var(--bg-body); }
    .proof-empty { width: 90px; height: 90px; border-radius: 10px; border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.72rem; text-align: center; padding: 0.4rem; }
    .lock-pill { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.3rem 0.7rem; border-radius: 20px; background: rgba(224,92,107,.14); color: var(--error); font-weight: 700; font-size: 0.75rem; }
    .locked-banner { display: flex; align-items: center; gap: 0.5rem; background: rgba(224,92,107,.1); border: 1px solid rgba(224,92,107,.3); color: var(--error); border-radius: 10px; padding: 0.75rem 1rem; font-size: 0.85rem; font-weight: 600; margin-bottom: 1rem; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-college" id="sidebarCollege"></div>
  <nav id="sideNav"></nav>
  <div class="sidebar-footer">
    <div class="theme-row">
      <span class="theme-label"><span id="themeIcon"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span><span id="themeLabel">Light mode</span></span>
      <label class="toggle-switch"><input type="checkbox" id="themeToggle"/><span class="toggle-track"></span></label>
    </div>
    <div class="user-pill">
      <div class="user-avatar" id="userAvatar">?</div>
      <div class="user-info"><div class="user-name" id="userName">…</div><div class="user-role" id="userRole">Faculty</div></div>
      <button class="btn-logout" id="logoutBtn" title="Sign out"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div>
      <h1 class="page-title">My Portal</h1>
      <p class="page-subtitle" id="pageSubtitle">Manage attendance for your mentored course(s)</p>
    </div>
  </div>

  <div class="content" id="mainContent">
    <div style="text-align:center; padding:4rem;"><span class="spin"></span> Loading portal...</div>
  </div>
</main>

<!-- Mark-attendance modal -->
<div class="modal-back" id="attModalBack">
  <div class="att-modal">
    <div class="att-modal-header">
      <div>
        <div class="att-modal-title" id="mTitle">—</div>
        <div class="att-modal-sub" id="mSub">—</div>
      </div>
      <button id="mCloseBtn" style="background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--text-muted);">✕</button>
    </div>
    <div class="att-modal-body" id="mBody"></div>
    <div class="att-modal-footer">
      <div id="mLockInfo"></div>
      <div style="display:flex; gap:0.6rem;">
        <button class="btn btn-ghost" id="mCloseBtn2">Close</button>
        <button class="btn btn-primary" id="mSaveBtn">Save Attendance</button>
      </div>
    </div>
  </div>
</div>

<!-- Student history modal (read-only) -->
<div class="modal-back" id="histModalBack">
  <div class="att-modal">
    <div class="att-modal-header">
      <div>
        <div class="att-modal-title" id="hTitle">—</div>
        <div class="att-modal-sub" id="hSub">—</div>
      </div>
      <button id="hCloseBtn" style="background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--text-muted);">✕</button>
    </div>
    <div class="att-modal-body" id="hBody"></div>
    <div class="att-modal-footer" style="justify-content:flex-end">
      <button class="btn btn-ghost" id="hCloseBtn2">Close</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { requireRole } from '/js/auth/session.js';
  import { initSidebar } from '/js/components/sidebar.js';
  import { supabase } from '/js/config/supabase.js';
  import { getClassAttendanceOverview, getStudentAttendanceHistory, studentName, fmtDate, fmtTime } from '/js/modules/reports.js';

  const session = await requireRole('faculty');
  initSidebar(session, 'faculty-portal');

  const CLOUD_NAME = 'duy7opouq';
  const UPLOAD_PRESET = 'ASAS_PROOFS';

  function toast(msg, type='success') {
    const c=document.getElementById('toast');
    const el=document.createElement('div');
    el.className=`toast-item ${type}`; el.textContent=msg;
    c.appendChild(el); setTimeout(()=>el.remove(),4000);
  }
  function localDateStr(d) {
    const dt = d ?? new Date();
    return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  }
  function courseLabel(c) {
    if (!c) return '—';
    return c.division ? `${c.year} ${c.program} ${c.division}` : `${c.year} ${c.program}`;
  }
  function fullName(s) { return [s.first_name, s.middle_name, s.last_name].filter(Boolean).join(' '); }
  function pctClass(pct) {
    if (pct === null || pct === undefined) return 'grey';
    if (pct >= 75) return 'green';
    if (pct >= 50) return 'amber';
    return 'red';
  }

  // ── Resolve mentored courses ──────────────────────────────
  const mainContent = document.getElementById('mainContent');

  const { data: facRow, error: facErr } = await supabase
    .from('faculty').select('id').eq('supabase_uid', session.user.id).single();

  if (facErr || !facRow) {
    mainContent.innerHTML = `<div class="not-mentor-card"><h2>Unable to load your faculty record</h2><p>Please contact the office if this keeps happening.</p></div>`;
    throw new Error('faculty lookup failed');
  }

  const { data: mentorRows, error: mentorErr } = await supabase
    .from('mentorship')
    .select('course:courses!course_id(id, year, program, division)')
    .eq('faculty_id', facRow.id)
    .eq('is_active', true);

  if (mentorErr) {
    mainContent.innerHTML = `<div class="not-mentor-card"><h2>Error loading mentorship info</h2><p>${mentorErr.message}</p></div>`;
    throw mentorErr;
  }

  const mentoredCourses = (mentorRows || []).map(r => r.course).filter(Boolean)
    .sort((a,b) => courseLabel(a).localeCompare(courseLabel(b)));

  if (!mentoredCourses.length) {
    mainContent.innerHTML = `
      <div class="not-mentor-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <h2>Not currently assigned as a mentor</h2>
        <p>You aren't listed as a mentor for any course yet. Once the admin assigns you to mentor a course, attendance tools for it will appear here.</p>
      </div>`;
    throw new Error('no mentorship');
  }

  let courseId = mentoredCourses[0].id;
  document.getElementById('pageSubtitle').textContent = mentoredCourses.length > 1
    ? `Managing attendance for ${mentoredCourses.length} mentored courses`
    : `Managing attendance for ${courseLabel(mentoredCourses[0])}`;

  const courseSelectHtml = mentoredCourses.length > 1
    ? `<div class="filter-field"><label>Course</label><select id="courseSelect">${mentoredCourses.map(c => `<option value="${c.id}">${courseLabel(c)}</option>`).join('')}</select></div>`
    : '';

  // ── Render shell (tabs + panels) ──────────────────────────
  mainContent.innerHTML = `
    <div class="tabs">
      <button class="tab active" data-tab="mark">Mark Attendance</button>
      <button class="tab" data-tab="students">Class Students</button>
    </div>

    <div id="tabMark">
      <div class="filter-card">
        ${courseSelectHtml}
        <div class="filter-field"><label>Date</label><input type="text" id="attDatePicker" class="filter-input" readonly /></div>
        <button class="btn btn-primary" id="loadBtn" style="height:40px;">Load</button>
      </div>
      <div id="lectureArea"><div class="empty-note">Select a date, then click Load.</div></div>
    </div>

    <div id="tabStudents" style="display:none">
      <div class="filter-card">
        ${mentoredCourses.length > 1 ? `<div class="filter-field"><label>Course</label><select id="courseSelectStudents">${mentoredCourses.map(c => `<option value="${c.id}">${courseLabel(c)}</option>`).join('')}</select></div>` : ''}
        <div class="filter-field"><label>From <span style="text-transform:none;font-weight:400">(optional)</span></label><input type="text" id="viewFrom" class="filter-input" readonly /></div>
        <div class="filter-field"><label>To <span style="text-transform:none;font-weight:400">(optional)</span></label><input type="text" id="viewTo" class="filter-input" readonly /></div>
        <div class="filter-field" style="max-width:160px"><label>Below %</label><input type="number" id="threshFilter" class="filter-input" placeholder="e.g. 75" min="0" max="100" /></div>
        <button class="btn btn-primary" id="viewLoadBtn" style="height:40px;">Load</button>
      </div>
      <div class="filter-card" style="padding:0.75rem 1.25rem;">
        <input type="text" id="studentSearch" class="filter-input" placeholder="🔍 Search by name or student ID..." style="min-width:280px" />
      </div>
      <div class="result-count" id="studentsCount" style="font-size:0.82rem;color:var(--text-muted);margin-bottom:0.75rem;"></div>
      <div class="table-wrap">
        <table id="studentsTable">
          <thead><tr>
            <th class="sortable" data-key="id">Student ID</th>
            <th class="sortable" data-key="name">Name</th>
            <th class="sortable" data-key="present">Present</th>
            <th class="sortable" data-key="absent">Absent</th>
            <th class="sortable" data-key="total">Total</th>
            <th class="sortable" data-key="pct">Attendance %</th>
          </tr></thead>
          <tbody id="studentsBody"><tr><td colspan="6" class="empty-note">Click Load to see your class's attendance standing.</td></tr></tbody>
        </table>
      </div>
    </div>
  `;

  // ── Tabs ──────────────────────────────────────────────────
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tabMark').style.display = btn.dataset.tab === 'mark' ? '' : 'none';
      document.getElementById('tabStudents').style.display = btn.dataset.tab === 'students' ? '' : 'none';
    });
  });

  if (document.getElementById('courseSelect')) {
    document.getElementById('courseSelect').addEventListener('change', (e) => { courseId = e.target.value; });
  }
  let studentsCourseId = courseId;
  if (document.getElementById('courseSelectStudents')) {
    document.getElementById('courseSelectStudents').addEventListener('change', (e) => { studentsCourseId = e.target.value; });
  }

  // ══════════════════════════════════════════════════════════
  // TAB 1 — Mark Attendance (mirrors admin's Attendance page)
  // ══════════════════════════════════════════════════════════
  let currentDate = localDateStr();
  let roster = [];
  let lectures = [];
  let attendance = {};
  let sessions = {};
  let activeLectureId = null;
  let modalSearch = '';
  let modalSort = { field: 'student_id', dir: 'asc' };

  flatpickr('#attDatePicker', {
    dateFormat: 'Y-m-d', defaultDate: new Date(), disableMobile: true,
    onChange([d]) { if (d) currentDate = localDateStr(d); }
  });

  document.getElementById('loadBtn').addEventListener('click', () => loadDay());

  async function loadDay() {
    activeLectureId = null;
    const area = document.getElementById('lectureArea');
    area.innerHTML = `<div style="text-align:center; padding:3rem;"><span class="spin"></span> Loading...</div>`;

    try {
      const { data: holChk } = await supabase.from('holidays').select('name').eq('holiday_date', currentDate).maybeSingle();
      if (holChk) { area.innerHTML = `<div class="empty-note">🎉 Holiday: ${holChk.name}. No lectures on this day.</div>`; return; }

      const [lecRes, rosterRes] = await Promise.all([
        supabase.from('daily_schedule')
          .select(`
            id, is_cancelled,
            time_slot:time_slots!time_slot_id (start_time, end_time, slot_label, sort_order),
            room:rooms!room_id (room_code),
            subject:subjects!subject_id (subject_name),
            assigned_faculty:faculty!assigned_faculty_id (full_name)
          `)
          .eq('schedule_date', currentDate)
          .eq('course_id', courseId),
        supabase.from('students')
          .select('id, student_id, first_name, middle_name, last_name')
          .eq('course_id', courseId)
          .eq('is_active', true)
          .order('student_id'),
      ]);
      if (lecRes.error) throw lecRes.error;
      if (rosterRes.error) throw rosterRes.error;

      lectures = (lecRes.data || []).filter(l => !l.is_cancelled)
        .sort((a, b) => (a.time_slot?.sort_order ?? 999) - (b.time_slot?.sort_order ?? 999));
      roster = rosterRes.data || [];

      if (!lectures.length) { area.innerHTML = `<div class="empty-note">No lectures scheduled for this course on this date.</div>`; return; }
      if (!roster.length) { area.innerHTML = `<div class="empty-note">This course has no students on record yet.</div>`; return; }

      const dsIds = lectures.map(l => l.id);
      const [attRes, sessRes] = await Promise.all([
        supabase.from('student_attendance').select('daily_schedule_id, student_id, status').in('daily_schedule_id', dsIds),
        supabase.from('attendance_sessions').select('daily_schedule_id, proof_image_url, is_locked').in('daily_schedule_id', dsIds),
      ]);
      if (attRes.error) throw attRes.error;
      if (sessRes.error) throw sessRes.error;

      attendance = {};
      for (const l of lectures) attendance[l.id] = {};
      for (const row of (attRes.data || [])) {
        if (row.status === 'present' || row.status === 'absent') attendance[row.daily_schedule_id][row.student_id] = row.status;
      }
      sessions = {};
      for (const row of (sessRes.data || [])) sessions[row.daily_schedule_id] = { proof_image_url: row.proof_image_url, is_locked: row.is_locked };

      renderLecturesTable();
    } catch (e) {
      toast(e.message, 'error');
      area.innerHTML = `<div class="empty-note">Error loading data.</div>`;
    }
  }

  function summarize(dsId) {
    const map = attendance[dsId] || {};
    let present = 0, absent = 0;
    for (const s of roster) {
      if (map[s.id] === 'present') present++;
      else if (map[s.id] === 'absent') absent++;
    }
    return { present, absent, notMarked: roster.length - present - absent, total: roster.length };
  }
  function rowColorClass(dsId) {
    const { total, notMarked } = summarize(dsId);
    if (total === 0 || notMarked > 0) return 'lr-none';
    return sessions[dsId]?.proof_image_url ? 'lr-green' : 'lr-red';
  }
  function markBadge(dsId) {
    const { present, absent, notMarked, total } = summarize(dsId);
    if (!total) return `<span class="mark-badge mark-none">No students</span>`;
    const marked = present + absent;
    const cls = marked === 0 ? 'mark-none' : marked === total ? 'mark-full' : 'mark-partial';
    return `<span class="mark-badge ${cls}">${marked}/${total} marked</span>`;
  }
  function imgBadge(dsId) {
    const has = !!sessions[dsId]?.proof_image_url;
    return `<span class="img-badge ${has ? 'img-yes' : 'img-no'}">${has ? '📷 Uploaded' : '📷 No photo'}</span>`;
  }

  function renderLecturesTable() {
    const area = document.getElementById('lectureArea');
    const rowsHtml = lectures.map(l => `
      <tr class="lecture-row ${rowColorClass(l.id)}" data-id="${l.id}">
        <td class="lr-time">${l.time_slot?.slot_label || 'Virtual'}</td>
        <td>${l.room?.room_code || '—'}</td>
        <td>${l.subject?.subject_name || '—'}</td>
        <td>${l.assigned_faculty?.full_name || '—'}</td>
        <td>${markBadge(l.id)}</td>
        <td>${imgBadge(l.id)} ${sessions[l.id]?.is_locked ? '<span class="lr-lock-icon" title="Locked by admin">🔒</span>' : ''}</td>
      </tr>`).join('');

    area.innerHTML = `
      <div class="table-wrap">
        <table><thead><tr><th>Time</th><th>Room</th><th>Subject</th><th>Faculty</th><th>Attendance</th><th>Proof</th></tr></thead>
        <tbody>${rowsHtml}</tbody></table>
      </div>`;

    area.querySelectorAll('.lecture-row').forEach(row => row.addEventListener('click', () => openModal(row.dataset.id)));
  }

  function openModal(dsId) {
    activeLectureId = dsId; modalSearch = ''; modalSort = { field: 'student_id', dir: 'asc' };
    document.getElementById('attModalBack').classList.add('open');
    renderModal();
  }
  function closeModal() { document.getElementById('attModalBack').classList.remove('open'); activeLectureId = null; }
  document.getElementById('mCloseBtn').addEventListener('click', closeModal);
  document.getElementById('mCloseBtn2').addEventListener('click', closeModal);

  function getFilteredSortedRoster() {
    let list = [...roster];
    if (modalSearch) { const t = modalSearch.toLowerCase(); list = list.filter(s => `${s.student_id} ${fullName(s)}`.toLowerCase().includes(t)); }
    list.sort((a,b) => {
      const av = modalSort.field === 'name' ? fullName(a) : a.student_id;
      const bv = modalSort.field === 'name' ? fullName(b) : b.student_id;
      const cmp = av.localeCompare(bv, undefined, { numeric:true });
      return modalSort.dir === 'asc' ? cmp : -cmp;
    });
    return list;
  }

  const STATUS_LABEL = { present: 'Present', absent: 'Absent' };
  function rosterRow(dsId, s, locked) {
    const status = attendance[dsId][s.id];
    const cls = status || 'not_marked';
    const label = STATUS_LABEL[status] || 'Not Marked';
    return `<tr>
      <td style="font-weight:600;">${s.student_id}</td>
      <td>${fullName(s)}</td>
      <td><button class="status-btn sb-${cls}" data-student-id="${s.id}" ${locked ? 'disabled' : ''}><span class="sb-dot"></span>${label}</button></td>
    </tr>`;
  }

  function renderModal() {
    const dsId = activeLectureId;
    const lecture = lectures.find(l => l.id === dsId);
    const { present, absent, notMarked } = summarize(dsId);
    const sess = sessions[dsId] || {};
    const locked = !!sess.is_locked;

    document.getElementById('mTitle').textContent = lecture.subject?.subject_name || '—';
    document.getElementById('mSub').textContent = `${lecture.time_slot?.slot_label || 'Virtual'} · ${lecture.room?.room_code || '—'} · ${lecture.assigned_faculty?.full_name || '—'}`;
    document.getElementById('mLockInfo').innerHTML = locked ? `<span class="lock-pill">🔒 Locked by admin</span>` : '';
    document.getElementById('mSaveBtn').style.display = locked ? 'none' : '';

    const body = document.getElementById('mBody');
    const sortedRoster = getFilteredSortedRoster();
    const sortArrow = (f) => modalSort.field === f ? (modalSort.dir === 'asc' ? ' ▲' : ' ▼') : '';

    body.innerHTML = `
      ${locked ? `<div class="locked-banner">🔒 This lecture's attendance has been locked by the admin and can no longer be edited.</div>` : ''}
      <div class="roster-summary">
        <span class="sum-chip"><span class="sum-dot" style="background:var(--text-muted)"></span>${notMarked} Not Marked</span>
        <span class="sum-chip"><span class="sum-dot" style="background:var(--success)"></span>${present} Present</span>
        <span class="sum-chip"><span class="sum-dot" style="background:var(--error)"></span>${absent} Absent</span>
      </div>
      <div class="roster-search-row"><input type="text" class="roster-search" id="modalSearchInput" placeholder="🔍 Search student name or ID..." value="${modalSearch}" /></div>
      <table class="roster-table">
        <thead><tr>
          <th class="sortable" data-field="student_id">Student ID${sortArrow('student_id')}</th>
          <th class="sortable" data-field="name">Name${sortArrow('name')}</th>
          <th style="width:160px">Status</th>
        </tr></thead>
        <tbody>${sortedRoster.map(s => rosterRow(dsId, s, locked)).join('') || `<tr><td colspan="3" style="text-align:center;padding:1.5rem;color:var(--text-muted);">No students match your search.</td></tr>`}</tbody>
      </table>
      <div class="proof-section">
        <div class="proof-title">Physical Attendance Sheet</div>
        <div class="proof-row">
          ${sess.proof_image_url ? `<a href="${sess.proof_image_url}" target="_blank"><img src="${sess.proof_image_url}" class="proof-preview" /></a>` : `<div class="proof-empty">No photo yet</div>`}
          ${locked ? '' : `<div style="display:flex;flex-direction:column;gap:0.5rem;">
            <input type="file" id="proofFileInput" accept="image/*" style="font-size:0.8rem;" />
            <button class="btn btn-ghost btn-sm" id="uploadProofBtn">${sess.proof_image_url ? 'Replace Photo' : 'Upload Photo'}</button>
          </div>`}
        </div>
      </div>`;

    if (locked) return;

    document.getElementById('modalSearchInput').addEventListener('input', (e) => {
      modalSearch = e.target.value; renderModal();
      const inp = document.getElementById('modalSearchInput'); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
    });
    document.querySelectorAll('.roster-table th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const field = th.dataset.field;
        if (modalSort.field === field) modalSort.dir = modalSort.dir === 'asc' ? 'desc' : 'asc';
        else modalSort = { field, dir: 'asc' };
        renderModal();
      });
    });
    document.querySelectorAll('.status-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const studentId = btn.dataset.studentId;
        const current = attendance[dsId][studentId];
        attendance[dsId][studentId] = !current ? 'present' : (current === 'present' ? 'absent' : 'present');
        renderModal();
      });
    });
    document.getElementById('uploadProofBtn').addEventListener('click', () => handleUploadProof(dsId));
  }

  document.getElementById('mSaveBtn').addEventListener('click', async () => {
    const dsId = activeLectureId;
    const btn = document.getElementById('mSaveBtn');
    btn.disabled = true;
    try {
      const rows = roster.map(s => ({
        daily_schedule_id: dsId, student_id: s.id,
        status: attendance[dsId][s.id] || 'absent',
        marked_by: session.user.id, marked_at: new Date().toISOString(), updated_at: new Date().toISOString(),
      }));
      const { error } = await supabase.from('student_attendance').upsert(rows, { onConflict: 'daily_schedule_id,student_id' });
      if (error) throw error;
      for (const s of roster) if (!attendance[dsId][s.id]) attendance[dsId][s.id] = 'absent';
      toast('Attendance saved');
      renderLecturesTable();
      closeModal();
    } catch (e) { toast(e.message, 'error'); } finally { btn.disabled = false; }
  });

  async function handleUploadProof(dsId) {
    const fileInput = document.getElementById('proofFileInput');
    const file = fileInput?.files[0];
    if (!file) { toast('Choose an image file first', 'warn'); return; }
    if (!file.type.startsWith('image/')) { toast('Please choose an image file', 'warn'); return; }
    if (file.size > 10 * 1024 * 1024) { toast('Image must be under 10MB', 'warn'); return; }

    const btn = document.getElementById('uploadProofBtn');
    btn.disabled = true; btn.textContent = 'Uploading...';
    try {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
      if (!res.ok) throw new Error('Image upload failed. Check your internet connection and try again.');
      const data = await res.json();
      const url = data.secure_url;

      const { error } = await supabase.from('attendance_sessions')
        .upsert({ daily_schedule_id: dsId, proof_image_url: url, updated_at: new Date().toISOString() }, { onConflict: 'daily_schedule_id' });
      if (error) throw error;

      if (!sessions[dsId]) sessions[dsId] = { proof_image_url: url, is_locked: false };
      else sessions[dsId].proof_image_url = url;

      toast('Photo uploaded');
      renderLecturesTable();
      renderModal();
    } catch (e) { toast(e.message, 'error'); }
    finally { btn.disabled = false; if (document.getElementById('uploadProofBtn')) btn.textContent = sessions[dsId]?.proof_image_url ? 'Replace Photo' : 'Upload Photo'; }
  }

  // ══════════════════════════════════════════════════════════
  // TAB 2 — Class Students (read-only, admin-table style)
  // ══════════════════════════════════════════════════════════
  let classRows = [];
  let studentsSort = { field: 'name', dir: 'asc' };

  flatpickr('#viewFrom', { dateFormat: 'Y-m-d', disableMobile: true });
  flatpickr('#viewTo',   { dateFormat: 'Y-m-d', disableMobile: true, defaultDate: new Date() });

  document.getElementById('viewLoadBtn').addEventListener('click', () => loadClassView());
  document.getElementById('studentSearch').addEventListener('input', renderStudentsTable);
  document.getElementById('threshFilter').addEventListener('input', renderStudentsTable);
  document.querySelectorAll('#studentsTable th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const field = th.dataset.key;
      if (studentsSort.field === field) studentsSort.dir = studentsSort.dir === 'asc' ? 'desc' : 'asc';
      else studentsSort = { field, dir: 'asc' };
      renderStudentsTable();
    });
  });

  async function loadClassView() {
    const tbody = document.getElementById('studentsBody');
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:2rem;"><span class="spin"></span> Loading...</td></tr>`;
    const from = document.getElementById('viewFrom').value || null;
    const to = document.getElementById('viewTo').value || null;
    const cid = studentsCourseId;

    try {
      const { rows, totalLectures } = await getClassAttendanceOverview(cid, from, to);
      classRows = rows;
      document.getElementById('studentsCount').dataset.total = totalLectures;
      renderStudentsTable();
    } catch (e) {
      toast(e.message, 'error');
      tbody.innerHTML = `<tr><td colspan="6" class="empty-note">Error loading data.</td></tr>`;
    }
  }

  function renderStudentsTable() {
    const tbody = document.getElementById('studentsBody');
    const totalLectures = parseInt(document.getElementById('studentsCount').dataset.total || '0', 10);

    if (!totalLectures) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty-note">No lectures held for this course in this range yet.</td></tr>`;
      document.getElementById('studentsCount').textContent = '';
      return;
    }

    const term = document.getElementById('studentSearch').value.toLowerCase();
    const threshVal = document.getElementById('threshFilter').value;
    const threshold = threshVal === '' ? 101 : parseFloat(threshVal);

    let rows = classRows.filter(r => r.pct < threshold);
    if (term) rows = rows.filter(r => `${r.student.student_id} ${studentName(r.student)}`.toLowerCase().includes(term));

    rows = [...rows].sort((a, b) => {
      let av, bv;
      switch (studentsSort.field) {
        case 'id':      av = a.student.student_id; bv = b.student.student_id; return studentsSort.dir === 'asc' ? av.localeCompare(bv, undefined, {numeric:true}) : bv.localeCompare(av, undefined, {numeric:true});
        case 'name':     av = studentName(a.student); bv = studentName(b.student); return studentsSort.dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
        case 'present':  return studentsSort.dir === 'asc' ? a.present - b.present : b.present - a.present;
        case 'absent':   return studentsSort.dir === 'asc' ? a.absent - b.absent : b.absent - a.absent;
        case 'total':    return studentsSort.dir === 'asc' ? a.total - b.total : b.total - a.total;
        case 'pct':      return studentsSort.dir === 'asc' ? a.pct - b.pct : b.pct - a.pct;
        default: return 0;
      }
    });

    document.getElementById('studentsCount').textContent = `${totalLectures} lecture(s) held · ${rows.length} of ${classRows.length} student(s) shown`;

    if (!rows.length) { tbody.innerHTML = `<tr><td colspan="6" class="empty-note">No students match your search/filter.</td></tr>`; return; }

    tbody.innerHTML = rows.map(r => `
      <tr class="lecture-row" data-id="${r.student.id}">
        <td style="font-weight:600;">${r.student.student_id}</td>
        <td>${studentName(r.student)}</td>
        <td>${r.present}</td>
        <td>${r.absent}</td>
        <td>${r.total}</td>
        <td><span class="pct-chip pc-${pctClass(r.pct)}">${r.pct}%</span></td>
      </tr>`).join('');

    tbody.querySelectorAll('tr[data-id]').forEach(row => {
      row.addEventListener('click', () => openHistoryModal(row.dataset.id));
    });
  }

  async function openHistoryModal(studentId) {
    const row = classRows.find(r => r.student.id === studentId);
    const from = document.getElementById('viewFrom').value || null;
    const to = document.getElementById('viewTo').value || null;
    document.getElementById('histModalBack').classList.add('open');
    document.getElementById('hTitle').textContent = row ? studentName(row.student) : '—';
    document.getElementById('hSub').textContent = row ? `${row.student.student_id} · ${row.pct}% Attendance (${row.present}/${row.total})` : '—';
    document.getElementById('hBody').innerHTML = `<div style="text-align:center;padding:2rem;"><span class="spin"></span> Loading history...</div>`;

    try {
      const result = await getStudentAttendanceHistory(studentId, studentsCourseId, from, to);
      if (!result.rows.length) { document.getElementById('hBody').innerHTML = `<div class="empty-note">No lecture history found for this range.</div>`; return; }
      document.getElementById('hBody').innerHTML = `
        <div class="table-wrap">
          <table><thead><tr><th>Date</th><th>Time</th><th>Subject</th><th>Faculty</th><th>Status</th></tr></thead>
          <tbody>${result.rows.map(r => `
            <tr>
              <td>${fmtDate(r.schedule_date)}</td>
              <td>${fmtTime(r.time_slot?.start_time)}–${fmtTime(r.time_slot?.end_time)}</td>
              <td>${r.subject?.subject_name ?? '—'}</td>
              <td>${r.assigned_faculty?.full_name ?? '—'}</td>
              <td>${r.status === 'present' ? '<span class="img-badge img-yes">Present</span>' : r.status === 'absent' ? '<span class="img-badge img-no">Absent</span>' : '<span class="mark-badge mark-none">Not Recorded</span>'}</td>
            </tr>`).join('')}</tbody></table>
        </div>`;
    } catch (e) {
      toast(e.message, 'error');
      document.getElementById('hBody').innerHTML = `<div class="empty-note">Error loading history.</div>`;
    }
  }
  document.getElementById('hCloseBtn').addEventListener('click', () => document.getElementById('histModalBack').classList.remove('open'));
  document.getElementById('hCloseBtn2').addEventListener('click', () => document.getElementById('histModalBack').classList.remove('open'));
</script>
</body>
</html>
